[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness"
version = "0.1.13"
description = "The simplest, thinnest, and most powerful harness to control your real browser with your agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "browser", "cdp", "chrome", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cdp-use==1.4.5",
    "fetch-use==0.4.0",
    "pillow==12.3.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
mcp = ["mcp==2.1.1"]
dev = [
    "build==1.6.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[project.scripts]
browser-harness = "browser_harness.run:main"
browser-harness-mcp = "browser_harness.mcp_cli:main"
avrixo-browser-ops-mcp = "browser_harness.governed_mcp:main"

[project.urls]
Homepage = "https://github.com/arees412/avrixo-browser-ops"
Repository = "https://github.com/arees412/avrixo-browser-ops"
Issues = "https://github.com/arees412/avrixo-browser-ops/issues"
Upstream = "https://github.com/browser-use/browser-harness"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_harness = ["SKILL.md", "video-template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["e2e: local end-to-end governance flow"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/browser_harness/governance"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
